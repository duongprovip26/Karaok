<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke TV</title>
<link rel="stylesheet" href="css/tv.css">
</head>
<body>
<div id="player"></div>

<!-- Màn hình chờ khi chưa có bài -->
<div id="idle">
  <div class="idle-title">🎤 Karaoke</div>
  <img id="qrBig" alt="QR">
  <div class="idle-text">Quét mã bằng điện thoại để chọn bài<br>hoặc vào <b id="idleUrl"></b> · mã phòng <b class="code" id="idleCode">------</b></div>
</div>

<!-- Tên bài đang hát (tự ẩn sau vài giây) -->
<div id="nowBar" class="hidden"><span class="label">Đang hát</span> <span id="nowTitle"></span> <span id="nowBy"></span></div>

<!-- Góc dưới phải: QR nhỏ + bài tiếp theo -->
<div id="corner" class="hidden">
  <div id="next" class="hidden"><span class="label">Tiếp theo</span><span id="nextTitle"></span></div>
  <div class="qr-box">
    <img id="qrSmall" alt="QR">
    <div class="code" id="cornerCode">------</div>
  </div>
</div>

<div id="scoreLayer" class="hidden">
  <div class="score-card">
    <div class="score-song" id="scSong"></div>
    <div class="score-num" id="scNum">0</div>
    <div class="score-cmt" id="scCmt"></div>
    <div class="score-detail" id="scBy"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>
<script type="module" src="js/tv.js"></script>
</body>
</html>
